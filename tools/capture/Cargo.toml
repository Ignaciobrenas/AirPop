[package]
name = "airpop-capture"
version = "0.2.0"
edition = "2021"
description = "CLI utility to capture and inspect Apple BLE proximity advertisements (0x004C)"

[dependencies]
anyhow = "1.0"
btleplug = "0.11"
clap = { version = "4.5", features = ["derive"] }
futures = "0.3"
hex = "0.4"
tokio = { version = "1.40", features = ["full"] }
