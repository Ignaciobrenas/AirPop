[package]
name = "airpop"
version = "1.1.0"
description = "3D proximity popup, dynamic battery tray icon, and listening-mode flyout for wireless earbuds"
authors = ["Ignacio Breñas"]
license = "MIT"
edition = "2021"

[lib]
name = "airpop_lib"
crate-type = ["rlib"]

[build-dependencies]
tauri-build = { version = "2.0.0", features = [] }

[dependencies]
anyhow = "1.0"
btleplug = "0.11"
clap = { version = "4.5", features = ["derive"] }
hex = "0.4"
image = "0.25"
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
tauri = { version = "2.0.0", features = ["tray-icon", "image-png", "macos-private-api"] }
tauri-plugin-autostart = "2.0.0"
tauri-plugin-notification = "2.0.0"
tauri-plugin-single-instance = "2.0.0"
tauri-plugin-store = "2.0.0"
thiserror = "2.0"
tiny-skia = "0.11"
tokio = { version = "1.40", features = ["full"] }
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
window-vibrancy = "0.5"

[target.'cfg(windows)'.dependencies]
windows = { version = "0.58", features = [
    "Devices_Bluetooth",
    "Devices_Bluetooth_Advertisement",
    "Devices_Enumeration",
    "Foundation",
    "Foundation_Collections",
    "Storage_Streams",
    "Win32_Foundation",
    "Win32_UI_Shell",
    "Win32_UI_WindowsAndMessaging",
] }

[target.'cfg(target_os = "linux")'.dependencies]
bluer = { version = "0.17", features = ["bluetoothd", "l2cap"] }
