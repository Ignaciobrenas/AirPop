name: Release Build

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:
    inputs:
      tag:
        description: "Release tag to upload .exe binaries to"
        required: true
        default: "v1.2.0"

jobs:
  release-windows:
    name: Build Windows .exe & Upload to Release
    permissions:
      contents: write
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: "npm"
          cache-dependency-path: ui/package-lock.json
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
        with:
          cache-on-failure: true
      - name: Build UI Production Bundle
        working-directory: ui
        run: |
          npm ci
          npm run build
      - name: Build Release Executables (.exe)
        run: |
          npx @tauri-apps/cli build --no-bundle
          cargo build --release -p airpop --bin airpop-capture
      - name: Upload .exe Assets to GitHub Release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          $TAG = if ("${{ github.event.inputs.tag }}" -ne "") { "${{ github.event.inputs.tag }}" } else { "${{ github.ref_name }}" }
          Copy-Item target\release\airpop.exe airpop-windows-x64.exe
          Copy-Item target\release\airpop-capture.exe airpop-capture-windows-x64.exe
          gh release upload $TAG target\release\airpop.exe airpop-windows-x64.exe airpop-capture-windows-x64.exe --clobber

  release-linux:
    name: Build Linux Ubuntu Binaries & Upload to Release
    permissions:
      contents: write
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: "npm"
          cache-dependency-path: ui/package-lock.json
      - name: Install Linux System Dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev build-essential curl wget file libxdo-dev libssl-dev libayatana-appindicator3-dev librsvg2-dev libasound2-dev libdbus-1-dev
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
        with:
          cache-on-failure: true
      - name: Build UI Production Bundle
        working-directory: ui
        run: |
          npm ci
          npm run build
      - name: Build Release Executables
        run: |
          npx @tauri-apps/cli build --no-bundle
          cargo build --release -p airpop --bin airpop-capture
      - name: Upload Linux Assets to GitHub Release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          TAG="${{ github.event.inputs.tag || github.ref_name }}"
          cp target/release/airpop airpop-linux-x64
          cp target/release/airpop-capture airpop-capture-linux-x64
          chmod +x airpop-linux-x64 airpop-capture-linux-x64
          gh release upload "$TAG" airpop-linux-x64 airpop-capture-linux-x64 --clobber
