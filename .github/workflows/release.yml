name: Release Build

on:
  push:
    tags:
      - "v*"

jobs:
  release-windows:
    permissions:
      contents: write
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - name: Install UI dependencies & build
        working-directory: ui
        run: |
          npm install
          npm run build
      - name: Build Tauri Bundle
        uses: tauri-apps/tauri-action@v0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          tagName: ${{ github.ref_name }}
          releaseName: "AirPop ${{ github.ref_name }}"
          releaseBody: "Instaladores oficiales MSI / NSIS para Windows 10 y Windows 11."
          releaseDraft: false
          prerelease: false
